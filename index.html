<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f8" />
  <title>Spider-Man Chat</title>
  <link rel="stylesheet" href="style.css?v=max_1.0" />
</head>
<body>

  <div class="app-wrapper">
    <main class="chat-container" id="chatContainer">
      <header class="chat-header">
        <div class="header-title">聊天</div>
      </header>

      <div class="spiderman-overlay" id="spiderOverlay" aria-hidden="true">
        <video 
          id="spiderVideo" 
          class="spiderman-video"
          playsinline
          webkit-playsinline
          x5-playsinline
          preload="auto"
        >
          <source src="spider.mp4" type="video/mp4">
          <source src="293_raw.mov" type="video/quicktime">
        </video>
      </div>

      <section class="chat-flow" id="chatFlow" aria-live="polite"></section>

      <form class="chat-bar" id="chatForm">
        <div class="input-container">
          <input 
            type="text" 
            id="msgInput" 
            placeholder="发个 mj 试试..." 
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
          />
        </div>
        <button type="button" id="sendBtn" aria-label="发送消息">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </main>
  </div>

  <script src="script.js?v=max_1.0"></script>
</body>
</html>
