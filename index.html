<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             viewport-fit=cover,
             user-scalable=no,
             interactive-widget=resizes-content"
  >

  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>MJ Chat</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app" id="app">

  <!-- 顶部导航 -->
  <header class="topbar">

    <div class="topbar-left">

      <button
        class="icon-btn back-btn"
        type="button"
        aria-label="返回"
      >
        ‹
      </button>

      <div class="avatar">
        M
      </div>

      <div class="chat-title">
        <strong>MJ</strong>
        <span>
          <i></i>
          在线
        </span>
      </div>

    </div>

    <div class="topbar-actions">

      <button
        class="icon-btn"
        id="soundBtn"
        type="button"
        aria-label="声音"
      >
        <span id="soundOn">🔊</span>
        <span id="soundOff" class="hidden">🔇</span>
      </button>

    </div>

  </header>


  <!-- 聊天区域 -->
  <main
    class="chat"
    id="chatViewport"
  >

    <div
      class="messages"
      id="messages"
      aria-live="polite"
    >

      <div class="date-label">
        今天
      </div>


      <div class="message-row other">

        <div class="message-bubble other-bubble">
          哈喽～
        </div>

      </div>


      <div class="message-row other">

        <div class="message-bubble other-bubble">
          在干嘛？
        </div>

      </div>


    </div>


    <!--
      MJ 彩蛋层

      注意：

      1. 不放进 messages
      2. 不参与滚动
      3. 不占用布局空间
      4. 永远覆盖在聊天内容之上
      5. 输入栏之下
    -->

    <div
      class="easter-egg"
      id="easterEgg"
      aria-hidden="true"
    >

      <video
        id="eggVideo"
        class="easter-egg-video"
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
        controlslist="nodownload noplaybackrate noremoteplayback"
      ></video>

    </div>

  </main>


  <!-- 输入框 -->

  <form
    class="composer"
    id="composer"
    autocomplete="off"
  >

    <button
      class="composer-extra"
      type="button"
      aria-label="更多"
    >
      ＋
    </button>


    <input
      id="messageInput"
      type="text"
      inputmode="text"
      enterkeyhint="send"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      maxlength="500"
      placeholder="发消息…"
    >


    <button
      class="send-button"
      id="sendButton"
      type="submit"
      aria-label="发送"
    >
      ↑
    </button>

  </form>

</div>


<div
  class="toast"
  id="toast"
></div>


<script src="script.js" defer></script>

</body>
</html>
