<!doctype html>
<html lang="zh-CN">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>MJ · 私信彩蛋</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

<div
  class="app"
  id="app"
>


  <!-- 顶部私信栏 -->

  <header class="topbar">

    <button
      class="back"
      type="button"
    >
      ‹
    </button>


    <div class="person">

      <div class="avatar">
        M
      </div>


      <div class="person-info">

        <div class="name">
          MJ
        </div>

        <div class="status">
          <i></i>
          在线
        </div>

      </div>

    </div>


    <button
      class="more"
      type="button"
    >
      •••
    </button>

  </header>


  <!-- 私信区域 -->

  <main
    class="chat"
    id="chat"
  >

    <div
      class="messages"
      id="messages"
    >

      <div class="date">
        今天
      </div>


      <div class="hint">
        发送 <b>MJ</b> 试试
      </div>

    </div>


    <!--

      蜘蛛侠彩蛋

      不属于聊天内容。

      不参与页面布局。

      只是覆盖在聊天区域上面。

    -->

    <div
      class="egg"
      id="egg"
      aria-hidden="true"
    >

      <video
        id="effect"
        class="effect"
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
      ></video>

    </div>

  </main>


  <!-- 输入区域 -->

  <form
    class="composer"
    id="composer"
    autocomplete="off"
  >

    <button
      class="plus"
      type="button"
    >
      ＋
    </button>


    <input
      id="input"
      type="text"
      maxlength="30"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      enterkeyhint="send"
      placeholder="发消息…"
    >


    <button
      class="send"
      type="submit"
    >
      ↑
    </button>

  </form>

</div>


<script
  src="script.js"
  defer
></script>


</body>
</html>
