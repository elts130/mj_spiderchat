<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Spider-Man Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="chat-container" id="chatContainer">
    <!-- 蜘蛛侠原版特效视频图层 (调用本地 spider.mp4) -->
    <div class="spiderman-overlay" id="spiderOverlay" aria-hidden="true">
      <video 
        id="spiderVideo" 
        class="spiderman-video"
        playsinline
        webkit-playsinline
        x5-playsinline
        preload="auto"
        src="spider.mp4"
      ></video>
    </div>

    <!-- 消息流区域 -->
    <section class="chat-flow" id="chatFlow" aria-live="polite"></section>

    <!-- 底部极简输入栏 -->
    <form class="chat-bar" id="chatForm" onsubmit="return false;">
      <div class="input-container">
        <input 
          type="text" 
          id="msgInput" 
          placeholder="发个 mj 试试..." 
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />
      </div>
      <button type="submit" id="sendBtn" aria-label="发送消息">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
