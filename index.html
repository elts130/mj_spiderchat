<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#f7f7f8"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <title>MJ 私信彩蛋</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app" id="app">

  <header class="topbar">

    <button
      class="icon-btn back"
      type="button"
      aria-label="返回"
    >
      ‹
    </button>

    <div
      class="person"
      aria-label="MJ"
    >

      <div class="avatar">
        M
      </div>

      <div class="person-copy">
        <strong>MJ</strong>

        <span>
          <i></i>
          在线
        </span>
      </div>

    </div>

    <button
      class="icon-btn more"
      type="button"
      aria-label="更多"
    >
      •••
    </button>

  </header>


  <main
    class="chat"
    id="chat"
  >

    <div
      class="messages"
      id="messages"
    >

      <div class="date-chip">
        今天
      </div>

      <div class="hint">
        发送 <b>MJ</b> 试试
      </div>

    </div>


    <!--
      特效独立层：

      不参与聊天布局
      不占聊天空间
      不会推开消息
    -->

    <div
      class="effect-layer"
      id="effectLayer"
      aria-hidden="true"
    >

      <canvas
        id="effectCanvas"
      ></canvas>

      <video
        id="effectVideo"
        playsinline
        webkit-playsinline
        preload="auto"
        muted
        aria-hidden="true"
      ></video>

    </div>

  </main>


  <form
    class="composer"
    id="composer"
    autocomplete="off"
  >

    <button
      class="plus"
      type="button"
      aria-label="更多"
    >
      ＋
    </button>

    <input
      id="input"
      type="text"
      maxlength="30"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      enterkeyhint="send"
      placeholder="发消息…"
    >

    <button
      class="send"
      type="submit"
      aria-label="发送"
    >
      ↑
    </button>

  </form>

</div>


<script
  src="script.js"
  defer
></script>

</body>
</html>
