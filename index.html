<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta 
    name="viewport" 
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" 
  />
  <meta name="theme-color" content="#f7f7f8" />
  <title>Spider-Man Chat</title>
  <link rel="stylesheet" href="style.css?v=prod_1.0" />
</head>
<body>

  <!-- 全局异常/状态提示 Toast -->
  <div class="toast-notice" id="toastNotice" role="alert" aria-live="assertive"></div>

  <div class="app-wrapper">
    <main class="chat-container" id="chatContainer">
      
      <!-- 顶部导航栏 (含蜘蛛侠状态与音效开关) -->
      <header class="chat-header">
        <div class="header-left">
          <span class="status-indicator"></span>
          <span class="header-title">蜘蛛侠互动聊天</span>
        </div>
        <div class="header-right">
          <button type="button" class="sound-toggle-btn" id="soundToggleBtn" aria-label="切换音效">
            <svg id="soundOnIcon" class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg id="soundOffIcon" class="icon hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- 视口核心交互区 -->
      <div class="chat-viewport" id="chatViewport">
        
        <!-- 消息流区域 -->
        <section class="chat-flow" id="chatFlow" aria-live="polite">
          <div class="msg-row bot">
            <div class="msg-bubble">你好！在下方输入 <b>mj</b> 发送，即可召唤我的专属出场特效！🕷️</div>
          </div>
        </section>

        <!-- 蜘蛛侠特效悬挂层 (纯净正片叠底，动画平滑淡入淡出) -->
        <div class="spiderman-overlay" id="spiderOverlay" aria-hidden="true">
          <video 
            id="spiderVideo" 
            class="spiderman-video"
            playsinline
            webkit-playsinline
            x5-playsinline
            x5-video-player-type="h5-page"
            t7-video-player-type="inline"
            preload="auto"
            muted
          >
            <source src="spider.mp4" type="video/mp4">
          </video>
        </div>

      </div>

      <!-- 底部输入栏 -->
      <form class="chat-bar" id="chatForm" onsubmit="return false;">
        <div class="input-container">
          <input 
            type="text" 
            id="msgInput" 
            placeholder="输入 mj 触发蜘蛛侠..." 
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
          />
        </div>
        <button type="button" id="sendBtn" aria-label="发送消息">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      
    </main>
  </div>

  <script src="script.js?v=prod_1.0"></script>
</body>
</html>
