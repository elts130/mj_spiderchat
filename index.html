<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >

  <meta name="theme-color" content="#ffffff">

  <title>MJ 私信彩蛋</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app" id="app">

  <header class="topbar">

    <button
      class="back"
      type="button"
      aria-label="返回"
    >
      ‹
    </button>

    <div class="profile">

      <div class="avatar">
        M
      </div>

      <div class="profile-text">
        <strong>MJ</strong>

        <span>
          <i></i>
          在线
        </span>
      </div>

    </div>

    <button
      class="icon-btn"
      id="soundBtn"
      type="button"
      aria-label="切换声音"
    >
      <span id="soundOn">🔊</span>
      <span id="soundOff" class="hidden">🔇</span>
    </button>

  </header>


  <main
    class="chat"
    id="chatViewport"
  >

    <div
      class="messages"
      id="messages"
      aria-live="polite"
    >

      <div class="day">
        今天
      </div>

      <div class="row other">
        <div class="bubble other-bubble">
          你好呀～
        </div>
      </div>

      <div class="row other">
        <div class="bubble other-bubble">
          试试发 <b>MJ</b> 👀
        </div>
      </div>

    </div>


    <!--
      MJ 特效独立层

      不进入聊天消息 DOM
      不参与滚动
      不占聊天气泡空间
    -->

    <div
      class="egg"
      id="egg"
      aria-hidden="true"
    >

      <video
        id="eggVideo"
        class="egg-video"
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
        controlslist="nodownload noplaybackrate noremoteplayback"
      ></video>

    </div>

  </main>


  <form
    class="composer"
    id="composer"
    autocomplete="off"
  >

    <button
      class="plus"
      type="button"
      aria-label="更多"
    >
      ＋
    </button>


    <input
      id="messageInput"
      type="text"
      inputmode="text"
      enterkeyhint="send"
      maxlength="500"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      placeholder="发消息…"
    >


    <button
      class="send"
      id="sendBtn"
      type="submit"
      aria-label="发送"
    >
      ➤
    </button>

  </form>

</div>


<div
  class="toast"
  id="toast"
  role="status"
  aria-live="polite"
></div>


<script src="script.js" defer></script>

</body>
</html>
