<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 新增 interactive-widget=resizes-content 完美适配 iOS15+ 键盘弹起 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#f7f7f8" />
  <title>Spider-Man Chat</title>
  <link rel="stylesheet" href="style.css?v=6.0" />
</head>
<body>

  <!-- 隐藏的原始视频源 (放置在 DOM 中确保后台解码，但不显示) -->
  <div class="video-decoder-box">
    <video 
      id="spiderVideo" 
      playsinline
      webkit-playsinline
      x5-playsinline
      preload="auto"
      muted
    >
      <source src="spider.mp4" type="video/mp4">
      <source src="293_raw.mov" type="video/quicktime">
    </video>
  </div>

  <div class="app-wrapper">
    <!-- 聊天主容器 (动态视口自适应) -->
    <main class="chat-container" id="chatContainer">
      
      <!-- 顶部导航条 -->
      <header class="chat-header">
        <div class="header-title">聊天</div>
      </header>

      <!-- 蜘蛛侠特效悬挂层 (基于 Canvas 物理抠图，100% 透明透字) -->
      <div class="spiderman-overlay" id="spiderOverlay" aria-hidden="true">
        <canvas id="spiderCanvas" class="spiderman-canvas"></canvas>
      </div>

      <!-- 消息流区域 -->
      <section class="chat-flow" id="chatFlow" aria-live="polite"></section>

      <!-- 底部输入栏 -->
      <form class="chat-bar" id="chatForm">
        <div class="input-container">
          <!-- 强制 16px 杜绝 iOS 自动放大陷阱 -->
          <input 
            type="text" 
            id="msgInput" 
            placeholder="发个 mj 试试..." 
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
          />
        </div>
        <button type="button" id="sendBtn" aria-label="发送消息">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      
    </main>
  </div>

  <script src="script.js?v=6.0"></script>
</body>
</html>
